<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>新版 ChatGPT UI · mock</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        font: 14px/1.6 -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
        background: #fff;
        color: #222;
      }
      #scroller {
        height: 100vh;
        overflow-y: auto;
      }
      #inner {
        position: relative;
      }
      article {
        position: absolute;
        left: 12%;
        right: 12%;
        box-sizing: border-box;
        padding: 10px 12px;
        border-radius: 10px;
        background: #f7f7f8;
        overflow: hidden;
      }
      article > div[data-message-author-role="user"] {
        background: #eef4ff;
        margin: -10px -12px;
        padding: 10px 12px;
        border-radius: 10px;
      }
      .who {
        font-size: 12px;
        color: #888;
        margin-bottom: 2px;
      }
      .file-card {
        display: inline-flex;
        gap: 6px;
        align-items: center;
        border: 1px solid #ddd;
        border-radius: 8px;
        padding: 2px 8px;
        margin: 0 6px 4px 0;
        font-size: 12px;
        background: #fff;
      }
      .file-card .badge {
        color: #b00;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <!--
      新版 ChatGPT UI 的三个变化（2026-11 现场确认）：
        1. 每条消息前面有看得见的「你说：」「ChatGPT 说：」标签
        2. 带附件的提问，附件卡片（文件名 + PDF 徽标）就渲染在消息里，
           innerText 会把它混进提问文本：「HW_07.pdfPDFLec 16...pdfPDF详细求解」
        3. 同一对话里真的有一字不差的重复提问（两条「详细求解」）
      接口返回的是干净文本。目录条目必须和接口对上、跳转必须分清双胞胎。
    -->
    <div id="scroller"><div id="inner"></div></div>
    <script>
      (function () {
        var msgs = window.__MSGS__ || [];
        var scroller = document.getElementById('scroller');
        var inner = document.getElementById('inner');
        var H = 120;
        inner.style.height = msgs.length * H + 'px';
        var mounted = new Map();

        function render() {
          var view = scroller.clientHeight || 800;
          var st = scroller.scrollTop;
          var lo = st - view * 0.3;
          var hi = st + view;
          var want = new Set();
          msgs.forEach(function (m, i) {
            var top = i * H;
            if (top + H > lo && top < hi) want.add(i);
          });
          mounted.forEach(function (el, i) {
            if (!want.has(i)) {
              el.remove();
              mounted.delete(i);
            }
          });
          want.forEach(function (i) {
            if (mounted.has(i)) return;
            var m = msgs[i];
            var art = document.createElement('article');
            art.setAttribute('data-testid', 'conversation-turn-' + i);
            art.setAttribute('data-q', String(Math.floor(i / 2)));
            art.style.top = i * H + 'px';
            art.style.height = H - 12 + 'px';
            var div = document.createElement('div');
            div.setAttribute('data-message-author-role', m.role);
            // ① 新 UI 的可见角色标签
            var who = document.createElement('div');
            who.className = 'who';
            who.textContent = m.role === 'user' ? '你说：' : 'ChatGPT 说：';
            div.appendChild(who);
            // ② 附件卡片（文件名 + PDF 徽标混在消息文本前面）
            if (m.files) {
              m.files.forEach(function (f) {
                var card = document.createElement('span');
                card.className = 'file-card';
                card.setAttribute('aria-label', '附件');
                var name = document.createElement('span');
                name.textContent = f;
                var badge = document.createElement('span');
                badge.className = 'badge';
                badge.textContent = 'PDF';
                card.appendChild(name);
                card.appendChild(badge);
                div.appendChild(card);
              });
            }
            var body = document.createElement('span');
            body.textContent = m.text;
            div.appendChild(body);
            art.appendChild(div);
            inner.appendChild(art);
            mounted.set(i, art);
          });
        }

        var ticking = false;
        scroller.addEventListener(
          'scroll',
          function () {
            if (ticking) return;
            ticking = true;
            requestAnimationFrame(function () {
              ticking = false;
              render();
            });
          },
          { passive: true }
        );

        window.__scrolls = 0;
        scroller.addEventListener('scroll', function () {
          window.__scrolls += 1;
        });

        render();
        scroller.scrollTop = scroller.scrollHeight;
        render();
      })();
    </script>
  </body>
</html>
