<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>追加 / 切分支 · Append mock</title>
    <style>
      body {
        margin: 0;
        font: 14px/1.6 -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
        background: #fff;
        color: #222;
      }
      #scroller {
        height: 100vh;
        overflow-y: auto;
        padding: 24px 15% 200px;
        box-sizing: border-box;
      }
      article {
        margin: 12px 0;
        padding: 10px 12px;
        border-radius: 10px;
        background: #f7f7f8;
      }
      article > div[data-message-author-role="user"] {
        background: #eef4ff;
      }
      .sep {
        display: flex;
        justify-content: center;
        margin: 16px 0 4px;
      }
      .sep .septxt {
        font-size: 12px;
        color: #6b7280;
        background: #eef0f3;
        border-radius: 20px;
        padding: 2px 10px;
      }
      /* 复刻真实现象：消息正文里会冒出「1/2」这种短文本，它长得像日期 */
      .inline-frac {
        font-size: 12px;
        color: #9aa0a6;
      }
    </style>
  </head>
  <body>
    <!--
      复刻「刚问出的问题在目录里显示在中间」：
        1. 先有 N 轮对话，目录 1..N 排好；
        2. 用户回到第 k 轮改写 / 重发（ChatGPT 会把第 k 轮之后的都丢掉，重新生成）；
        3. 旧分支的条目已经不在页面上了，但档案里还在 —— 它们挂在新问题后面，
           把「刚问的那句」挤到了目录中间。

      对外接口（测试脚本调用）：
        __demo.addTurn(q, a)            追加一轮（站点继续往后编号）
        __demo.addTurnReuse(q, a, n)    追加一轮，但复用第 n 轮的 article 编号（站点复用序号）
        __demo.truncate(n)              只保留前 n 轮（切分支 / 编辑消息后的样子）
        __demo.toBottom()               滚到最底
        __demo.fakeFrac(true)           在最后一条提问里塞一个「1/2」
    -->
    <div id="scroller"><div class="sep"><span class="septxt">今天</span></div></div>
    <script>
      (function () {
        var Q = new URLSearchParams(location.search);
        var N = parseInt(Q.get('n') || '9', 10) || 9;
        var scroller = document.getElementById('scroller');
        var turns = []; // {id, qEl, aEl}
        var nextId = 0;

        function makeTurn(qText, aText, qId, aId) {
          var qArt = document.createElement('article');
          qArt.setAttribute('data-testid', 'conversation-turn-' + qId);
          var qDiv = document.createElement('div');
          qDiv.setAttribute('data-message-author-role', 'user');
          qDiv.textContent = qText;
          qArt.appendChild(qDiv);

          var aArt = document.createElement('article');
          aArt.setAttribute('data-testid', 'conversation-turn-' + aId);
          var aDiv = document.createElement('div');
          aDiv.setAttribute('data-message-author-role', 'assistant');
          aDiv.textContent = aText;
          aArt.appendChild(aDiv);

          scroller.appendChild(qArt);
          scroller.appendChild(aArt);
          turns.push({ id: qId, qEl: qArt, aEl: aArt, qText: qText });
          nextId = Math.max(nextId, aId + 1);
        }

        function seed() {
          for (var i = 0; i < N; i += 1) {
            makeTurn(
              '第 ' + (i + 1) + ' 个问题：验证追加与切分支之后目录顺序还对不对',
              '第 ' + (i + 1) + ' 条回答：' + new Array(4).join('内容填充，'),
              nextId,
              nextId + 1
            );
          }
        }
        seed();

        function toBottom() {
          scroller.scrollTop = scroller.scrollHeight;
        }

        window.__demo = {
          count: function () {
            return turns.length;
          },
          addTurn: function (q, a) {
            makeTurn(q, a || '这是一条新回答。', nextId, nextId + 1);
            toBottom();
            return turns.length;
          },
          // 站点复用编号：新消息顶掉了某一轮原来的 article 编号
          addTurnReuse: function (q, a, n) {
            var old = turns[n];
            if (old) {
              old.qEl.removeAttribute('data-testid');
              old.aEl.removeAttribute('data-testid');
            }
            makeTurn(q, a || '这是一条新回答。', n * 2, n * 2 + 1);
            toBottom();
            return turns.length;
          },
          truncate: function (n) {
            while (turns.length > n) {
              var t = turns.pop();
              t.qEl.remove();
              t.aEl.remove();
            }
            nextId = n * 2;
            toBottom();
            return turns.length;
          },
          toBottom: toBottom,
          fakeFrac: function () {
            var last = turns[turns.length - 1];
            if (!last) return;
            var s = document.createElement('span');
            s.className = 'inline-frac';
            s.textContent = '1/2';
            last.qEl.querySelector('[data-message-author-role]').appendChild(s);
          }
        };

        toBottom();
      })();
    </script>
  </body>
</html>
