<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>时间线分组测试 · Timeline mock</title>
    <style>
      body {
        margin: 0;
        font: 14px/1.6 -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
        background: #fff;
        color: #222;
      }
      /* 复刻 ChatGPT 的结构：一个固定高度的滚动容器，消息是 article，
         两轮之间插一条「日期分隔条」（没有稳定选择器，只能靠文本认） */
      #scroller {
        height: 100vh;
        overflow-y: auto;
        padding: 24px 15% 400px;
        box-sizing: border-box;
      }
      article {
        margin: 14px 0;
        padding: 10px 12px;
        border-radius: 10px;
        background: #f7f7f8;
      }
      article[data-testid^="conversation-turn"] > div[data-message-author-role="user"] {
        background: #eef4ff;
        margin: -10px -12px;
        padding: 10px 12px;
        border-radius: 10px;
      }
      .sep {
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 18px 0 6px;
      }
      .sep .septxt {
        font-size: 12px;
        color: #6b7280;
        background: #eef0f3;
        border-radius: 20px;
        padding: 2px 10px;
      }
    </style>
  </head>
  <body>
    <div id="scroller"></div>
    <script>
      (function () {
        var Q = new URLSearchParams(location.search);
        var DAYS = [
          {
            label: '今天',
            turns: [
              { q: '今天第一问：MoS2 的拉曼峰位在哪', a: 'E2g 约 383 cm-1，A1g 约 408 cm-1，差值反映层数。' },
              { q: '今天第二问：怎么判断单层', a: '看 E2g 与 A1g 的间距，单层约 18-20 cm-1，并看 Si 峰强度比。' }
            ]
          },
          {
            label: '昨天',
            turns: [
              { q: '昨天第一问：金辅助剥离要注意什么', a: '注意蒸金厚度和退火温度，剥离后残留金要用碘化钾清洗。' },
              { q: '昨天第二问：剥离后为什么要退火', a: '退火可以改善接触，降低缺陷密度，但温度过高会让 MoS2 分解。' }
            ]
          },
          {
            label: '10月24日',
            turns: [
              { q: '十月二十四日第一问：衬底怎么清洗', a: '丙酮、异丙醇、去离子水依次超声，氮气吹干后再用氧等离子体处理。' },
              { q: '十月二十四日第二问：等离子体处理多久', a: '一般 60 到 120 秒，功率不宜过高，否则表面会变粗糙。' }
            ]
          }
        ];

        var scroller = document.getElementById('scroller');
        var turnId = 0;
        var total = 0;

        DAYS.forEach(function (day) {
          var sep = document.createElement('div');
          sep.className = 'sep';
          var txt = document.createElement('span');
          txt.className = 'septxt';
          txt.textContent = day.label;
          sep.appendChild(txt);
          scroller.appendChild(sep);

          day.turns.forEach(function (t) {
            var qTurn = document.createElement('article');
            qTurn.setAttribute('data-testid', 'conversation-turn-' + turnId);
            var qDiv = document.createElement('div');
            qDiv.setAttribute('data-message-author-role', 'user');
            qDiv.textContent = t.q;
            qTurn.appendChild(qDiv);
            scroller.appendChild(qTurn);
            turnId += 1;

            var aTurn = document.createElement('article');
            aTurn.setAttribute('data-testid', 'conversation-turn-' + turnId);
            var aDiv = document.createElement('div');
            aDiv.setAttribute('data-message-author-role', 'assistant');
            aDiv.textContent = t.a;
            aTurn.appendChild(aDiv);
            scroller.appendChild(aTurn);
            turnId += 1;

            total += 1;
          });
        });

        window.__dayLabels = DAYS.map(function (d) {
          return d.label;
        });
        window.__turns = turnId;
        window.__questions = total;

        // ?start=bottom 停在底部（复刻长对话的真实打开姿势）
        if (Q.get('start') === 'bottom') {
          scroller.scrollTop = scroller.scrollHeight;
        }
      })();
    </script>
  </body>
</html>
